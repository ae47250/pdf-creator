openapi: 3.1.2
info:
  title: PDF Creation Service
  version: 1.0.0
  description: Authenticated conversion of completed, self-contained HTML into validated PDFs.
paths:
  /api/v1/pdfs:
    post:
      operationId: createPdf
      description: >-
        Converts one completed self-contained HTML document into one PDF. Stored
        requests require a caller-generated idempotencyKey. Reusing that key with
        the same semantic payload returns the original report; reusing it with a
        different semantic payload returns 409 idempotency_conflict. Direct
        requests set storeResult and storeHtml to false and omit idempotencyKey.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./pdf-creation.schema.json
      responses:
        "200":
          description: Direct PDF or stored-result receipt.
          content:
            application/pdf:
              schema: { type: string, contentMediaType: application/pdf }
            application/json:
              schema: { $ref: "#/components/schemas/StoredResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409":
          description: The caller-scoped idempotency key was already used for a different semantic request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RetryableError" }
        "500": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }
  /reports/{reportId}:
    get:
      operationId: viewStoredReport
      description: Application route that returns a private stored PDF inline. It is not a presigned R2 URL.
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200": { $ref: "#/components/responses/StoredPdf" }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /reports/{reportId}/download:
    get:
      operationId: downloadStoredReport
      description: Application route that returns a private stored PDF as an attachment. It is not a presigned R2 URL.
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200": { $ref: "#/components/responses/StoredPdf" }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Error:
      description: Controlled service error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RetryableError:
      description: Controlled overload response. `renderer_busy` uses Retry-After 1; `rate_limited` uses Retry-After 60.
      headers:
        Retry-After:
          required: true
          schema: { type: integer, enum: [1, 60] }
        X-Request-Id:
          required: true
          schema: { type: string, format: uuid }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    StoredPdf:
      description: Stored PDF returned by an application route.
      headers:
        Content-Disposition:
          required: true
          schema: { type: string }
      content:
        application/pdf:
          schema: { type: string, contentMediaType: application/pdf }
  parameters:
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string
        pattern: '^r(1|7|30)_[0-9a-fA-F-]{36}$'
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId, details]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string, format: uuid }
            correlationId: { type: string }
            details: { type: array, items: {} }
    StoredResponse:
      type: object
      required: [status, requestId, reportId, caller, filename, createdAt, expiresAt, durationMs, htmlBytes, pdfBytes, pageCount, pageDimensions, sha256, storage, links]
      properties:
        status: { const: complete }
        requestId: { type: string, format: uuid }
        reportId: { type: string }
        caller: { type: string }
        correlationId: { type: string }
        filename: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        durationMs: { type: integer }
        htmlBytes: { type: integer }
        pdfBytes: { type: integer }
        pageCount: { type: integer }
        pageDimensions:
          type: array
          items:
            type: object
            properties:
              widthPoints: { type: number }
              heightPoints: { type: number }
        sha256: { type: string }
        storage:
          type: object
          additionalProperties: false
          required: [status, htmlStored, idempotentReplay]
          properties:
            status: { const: stored }
            htmlStored: { type: boolean }
            idempotentReplay: { type: boolean }
        links:
          type: object
          additionalProperties: false
          required: [view, download]
          properties:
            view: { type: string, format: uri }
            download: { type: string, format: uri }
